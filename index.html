<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AG Cinematic Booking</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #111;
    color: white;
}

.container {
    max-width: 650px;
    margin: auto;
    background: #1a1a1a;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 0 15px rgba(255,165,0,0.3);
}

.logo {
    display: block;
    margin: 0 auto 15px auto;
    width: 150px;
    border-radius: 15px;
}

h1 {
    text-align: center;
    color: orange;
    margin-bottom: 10px;
}

.tagline {
    text-align: center;
    color: #ccc;
    margin-bottom: 20px;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input,
select,
textarea {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    border-radius: 8px;
    border: none;
    box-sizing: border-box;
}

input:focus,
select:focus,
textarea:focus {
    outline: 2px solid orange;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button {
    margin-top: 20px;
    width: 100%;
    padding: 14px;
    background: linear-gradient(45deg, #ff9800, #ff5722);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.95;
}

.result {
    margin-top: 20px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
}

.social-links {
    text-align: center;
    margin-top: 25px;
}

.social-links a {
    color: orange;
    text-decoration: none;
    display: block;
    margin: 10px 0;
    font-size: 16px;
}

.footer {
    text-align: center;
    margin-top: 25px;
    color: #ccc;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

    <!-- Replace logo URL -->
    <img
        src="https://drive.google.com/file/d/10ATBHEc0dwsN9s568TwClwQdshWS4Giz/view?usp=sharing"
        alt="AG Cinematic Logo"
        class="logo"
        onerror="this.style.display='none'"
    >

    <h1>🎬 AG CINEMATIC Booking</h1>

    <p class="tagline">
        Professional Reels • Wedding Shoots • Pre-Wedding • Events
    </p>

    <form id="bookingForm">

        <label>Full Name</label>
        <input type="text" name="name" placeholder="Enter your name" required>

        <label>Phone Number</label>
        <input type="tel" name="phone" placeholder="Enter phone number" required>

        <label>Event Type</label>
        <select name="eventType" id="eventType" required>
            <option value="">Select Event</option>
            <option>Wedding</option>
            <option>Pre-Wedding</option>
            <option>Engagement</option>
            <option>Haldi Ceremony</option>
            <option>Birthday</option>
            <option>Baby Shower</option>
            <option>Corporate Event</option>
            <option>Political Reel</option>
            <option>Car Opening</option>
            <option>Shop Opening</option>
            <option>Home Ceremony</option>
            <option>Product Reel</option>
            <option>Other</option>
        </select>
<div id="otherEventDiv" style="display:none;">
    <label>Please Specify Event Type</label>
    <input
        type="text"
        name="otherEventType"
        id="otherEventType"
        placeholder="Enter event type"
    >
</div>
        <label>Event Date</label>
        <input type="date" name="eventDate" required>

        <label>Location / Venue</label>
        <input type="text" name="location" placeholder="Enter venue or city" required>

        <label>Package Selection</label>
        <select name="reels">
            <option value="1 Reel">1 Reel (₹1499)</option>
            <option value="2 Reels">2 Reels (₹2999)</option>
            <option value="3 Reels">3 Reels (₹3999)</option>
            <option value="Premium Package">Premium Package (Custom Quote)</option>
        </select>

        <label>Instagram Profile (Optional)</label>
        <input
            type="text"
            name="instagram"
            placeholder="@your_instagram"
        >

        <label>Additional Requirements</label>
        <textarea
            name="message"
            placeholder="Tell us about your event, theme, special requests, etc."
        ></textarea>
<p style="font-size:12px;color:#ccc;text-align:center;">
By submitting this form, you agree to be contacted by AG Cinematic regarding your booking inquiry.
</p>
        <button type="submit">Submit Booking</button>

    </form>

    <div class="result" id="result"></div>

    <div class="social-links">

        <a href="https://wa.me/qr/OOQD7KN32TCWD1" target="_blank">
            💬 Chat on WhatsApp
        </a>

        <a href="https://www.instagram.com/ag._cinematics_?igsh=MWxvd3YzcmkxNjlwNQ==" target="_blank">
            📸 View Our Work on Instagram
        </a>

    </div>

    <div class="footer">
        AG Cinematic | Creating Memories Through Reels 🎥
    </div>

</div>

<script>
document.getElementById("bookingForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const form = this;
    const result = document.getElementById("result");

    result.innerHTML = "⏳ Submitting your booking...";

    fetch("https://script.google.com/macros/s/AKfycbxQqU4qNsYbIfClxEANCeEfv1r6hVRKMDDRp5cFU6O6NJz3wXwJ4baPKcV1JySmVvOF/exec", {
        method: "POST",
        body: new FormData(form)
    })
    .then(response => response.text())
.then(data => {

    document.querySelector(".container").innerHTML = `
        <div style="
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            min-height:70vh;
            text-align:center;
        ">
            <h1 style="color:orange;">✅ Booking Submitted Successfully!</h1>

            <p style="font-size:20px; margin-top:15px;">
                Thank you for choosing AG Cinematic.
            </p>

            <p style="color:#ccc;">
                We have received your booking details and will contact you shortly.
            </p>

            <p style="margin-top:20px;">
                🎥 Creating Memories Through Reels
            </p>
        </div>
    `;

})
    .catch(error => {

        result.innerHTML =
        "❌ Something went wrong. Please try again.";

        console.error(error);

    });

});
</script>

</body>
</html>
