<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AG Cinematic Booking</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #111;
    color: white;
}

.container {
    max-width: 650px;
    margin: auto;
    background: #1a1a1a;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 0 15px rgba(255,165,0,0.3);
}

h1 {
    text-align: center;
    color: orange;
    margin-bottom: 20px;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input,
select,
textarea {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    border-radius: 8px;
    border: none;
    box-sizing: border-box;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button {
    margin-top: 25px;
    width: 100%;
    padding: 14px;
    background: linear-gradient(45deg, #ff9800, #ff5722);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.95;
}

.result {
    margin-top: 20px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
}

.footer {
    text-align: center;
    margin-top: 20px;
    color: #ccc;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

    <h1>🎬 AG CINEMATIC Booking</h1>

    <form id="bookingForm">

        <label>Full Name</label>
        <input type="text" name="name" placeholder="Enter your name" required>

        <label>Phone Number</label>
        <input type="tel" name="phone" placeholder="Enter phone number" required>

        <label>Event Type</label>
        <select name="eventType" required>
            <option value="">Select Event</option>
            <option>Wedding</option>
            <option>Pre-Wedding</option>
            <option>Engagement</option>
            <option>Birthday</option>
            <option>Baby Shower</option>
            <option>Corporate Event</option>
            <option>Other</option>
        </select>

        <label>Event Date</label>
        <input type="date" name="eventDate" required>

        <label>Location / Venue</label>
        <input type="text" name="location" placeholder="Enter venue or city" required>

        <label>Number of Reels</label>
        <select name="reels">
            <option value="1">1 Reel (₹1499)</option>
            <option value="2">2 Reels (₹2999)</option>
            <option value="3">3 Reels (₹3999)</option>
        </select>

        <label>Additional Requirements</label>
        <textarea name="message" placeholder="Tell us about your event, theme, special requests, etc."></textarea>

        <button type="submit">Submit Booking</button>

    </form>

    <div class="result" id="result"></div>

    <div class="footer">
        AG Cinematic | Creating Memories Through Reels 🎥
    </div>

</div>

<script>
document.getElementById("bookingForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const form = this;
    const result = document.getElementById("result");

    result.innerHTML = "⏳ Submitting your booking...";

    fetch("https://script.google.com/macros/s/AKfycbxQqU4qNsYbIfClxEANCeEfv1r6hVRKMDDRp5cFU6O6NJz3wXwJ4baPKcV1JySmVvOF/exec", {
        method: "POST",
        body: new FormData(form)
    })
    .then(response => response.text())
    .then(data => {
        result.innerHTML =
        "🎉 Thank you for booking AG Cinematic! We have received your details and will contact you shortly.";

        form.reset();
    })
    .catch(error => {
        result.innerHTML =
        "❌ Something went wrong. Please try again.";
        console.error(error);
    });

});
</script>

</body>
</html>
